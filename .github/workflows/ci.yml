name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Test
        working-directory: gosx-native
        run: go test -race ./...
      - name: Scaffold smoke
        working-directory: gosx-native
        run: |
          go build -o "$RUNNER_TEMP/gsxnative" ./cmd/gsxnative
          appdir="$RUNNER_TEMP/GSXSmoke"
          "$RUNNER_TEMP/gsxnative" init "$appdir" --name GSXSmoke --module com.example.gsxsmoke --runtime-root "$PWD"
          "$RUNNER_TEMP/gsxnative" check ios "$appdir/src/app.gsx"
          "$RUNNER_TEMP/gsxnative" check android "$appdir/src/app.gsx"
          (cd "$appdir" && "$RUNNER_TEMP/gsxnative" dev all --once --reload-stamp .gsxnative/reload.json --reload-command './scripts/reload-native.sh')
          test -s "$appdir/.gsxnative/reload.json"
      - name: Vet
        working-directory: gosx-native
        run: go vet ./...
      - name: Format check
        working-directory: gosx-native
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Scene3D conformance
        working-directory: gosx-native
        run: make scene-conform

  build-smoke-macos:
    runs-on: macos-26
    needs: unit-linux
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Select iOS simulator
        run: |
          set -euo pipefail
          simulator="$(
            python3 <<'PY'
          import json
          import subprocess
          import sys

          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )
          for runtime_devices in devices.get("devices", {}).values():
              for device in runtime_devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      print(name)
                      sys.exit(0)
          sys.exit("no available iPhone simulator found")
          PY
          )"
          echo "IOS_SIMULATOR_NAME=$simulator" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,name=$simulator,OS=latest" >> "$GITHUB_ENV"
          echo "Using iOS simulator: $simulator"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: CLI iOS build
        working-directory: gosx-native
        run: |
          go run ./cmd/gsxnative build ios
          git diff --exit-code -- examples/counter-ios/CounterDemo/Generated/Counter.swift
      - name: CLI Scene3D iOS build
        working-directory: gosx-native
        run: |
          go run ./cmd/gsxnative build ios --source testdata/corpus/go/scene3d.gsx --output examples/counter-ios/CounterDemo/Generated/SceneDemo.swift
          git diff --exit-code -- examples/counter-ios/CounterDemo/Generated/SceneDemo.swift
      - name: Scaffolded iOS app build
        working-directory: gosx-native
        run: |
          go build -o "$RUNNER_TEMP/gsxnative" ./cmd/gsxnative
          appdir="$RUNNER_TEMP/GSXSmokeIOS"
          "$RUNNER_TEMP/gsxnative" init "$appdir" --name GSXSmokeIOS --module com.example.gsxsmokeios --runtime-root "$PWD"
          (cd "$appdir" && "$RUNNER_TEMP/gsxnative" build ios)
      - name: Scene3D fixture iOS compile matrix
        working-directory: gosx-native
        run: make build-scene3d-fixtures-ios
      - name: E2E
        working-directory: gosx-native
        run: go test -timeout 20m -tags smoke -v ./test/e2e/...

  android-smoke-linux:
    runs-on: ubuntu-latest
    needs: unit-linux
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Refresh generated native sources
        working-directory: gosx-native
        run: |
          go version
          go run ./cmd/gsxnative build android
          go run ./cmd/gsxnative build android --source testdata/corpus/go/scene3d.gsx --output examples/counter-android/app/src/main/kotlin/generated/SceneDemo.kt --task :app:compileDebugKotlin
          git diff --exit-code -- examples/counter-android/app/src/main/kotlin/generated/Counter.kt examples/counter-android/app/src/main/kotlin/generated/SceneDemo.kt
      - name: Scaffolded Android app build
        working-directory: gosx-native
        run: |
          go build -o "$RUNNER_TEMP/gsxnative" ./cmd/gsxnative
          appdir="$RUNNER_TEMP/GSXSmokeAndroid"
          "$RUNNER_TEMP/gsxnative" init "$appdir" --name GSXSmokeAndroid --module com.example.gsxsmokeandroid --runtime-root "$PWD"
          (cd "$appdir" && "$RUNNER_TEMP/gsxnative" build android --task :app:compileDebugKotlin)
      - name: Scene3D fixture Android compile matrix
        working-directory: gosx-native
        run: make build-scene3d-fixtures-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept Android SDK licenses
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
      - name: Run Android counter UI test
        working-directory: gosx-native/examples/counter-android
        timeout-minutes: 20
        run: gradle --no-daemon :app:ciApi30DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
