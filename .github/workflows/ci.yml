name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Test
        working-directory: gosx-native
        run: go test -race ./...
      - name: Vet
        working-directory: gosx-native
        run: go vet ./...
      - name: Format check
        working-directory: gosx-native
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  build-smoke-macos:
    runs-on: macos-latest
    needs: unit-linux
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: E2E
        working-directory: gosx-native
        run: go test -tags smoke -v ./test/e2e/...

  android-smoke-linux:
    runs-on: ubuntu-latest
    needs: unit-linux
    steps:
      - uses: actions/checkout@v6
        with:
          path: gosx-native
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gosx
          path: gosx
      - uses: actions/checkout@v6
        with:
          repository: odvcencio/gotreesitter
          path: gotreesitter
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: gosx-native/go.mod
      - name: Normalize Go toolchain
        run: |
          echo "$(go env GOROOT)/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Refresh generated Counter
        working-directory: gosx-native
        run: |
          go version
          go run ./cmd/gsxnative emit android testdata/corpus/swift/counter.swift.gsx > examples/counter-android/app/src/main/kotlin/generated/Counter.kt
          git diff --exit-code -- examples/counter-android/app/src/main/kotlin/generated/Counter.kt
      - name: Build runtime AAR and Counter APK
        working-directory: gosx-native/examples/counter-android
        run: gradle --no-daemon :gsx-nativekit:assembleRelease :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android emulator image
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Run Android counter UI test
        working-directory: gosx-native/examples/counter-android
        timeout-minutes: 20
        run: |
          set -euo pipefail

          avdmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          emulator="${ANDROID_HOME}/emulator/emulator"
          adb="${ANDROID_HOME}/platform-tools/adb"

          echo "no" | "$avdmanager" create avd --force --name gosx_counter_api_35 --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          "$emulator" -avd gosx_counter_api_35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics &
          emulator_pid=$!
          trap '"$adb" emu kill || kill "$emulator_pid" || true' EXIT

          "$adb" wait-for-device
          boot_completed=""
          until [ "$boot_completed" = "1" ]; do
            boot_completed=$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 2
          done

          "$adb" shell settings put global window_animation_scale 0 || true
          "$adb" shell settings put global transition_animation_scale 0 || true
          "$adb" shell settings put global animator_duration_scale 0 || true
          "$adb" shell input keyevent 82 || true

          gradle --no-daemon :app:connectedDebugAndroidTest
